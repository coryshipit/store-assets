name: Build Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tags must use vX.Y.Z format"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist
          cp -r starter-kit dist/store-assets
          KIT_SOURCE_COMMIT="$(git rev-parse --verify 'HEAD^{commit}')" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'dist/store-assets/';
          const provenance = JSON.parse(fs.readFileSync(root + 'provenance.json', 'utf8'));
          const release = process.env.GITHUB_REF_NAME;
          const commit = process.env.KIT_SOURCE_COMMIT;
          const repository = process.env.GITHUB_REPOSITORY;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(release || '') || !/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/.test(commit || '') ||
              !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository || '') ||
              repository.split('/').some(part => part === '.' || part === '..')) throw new Error('Invalid release source identity');
          if (provenance.schema_version !== 1 || provenance.local_adaptations?.length !== 0 || provenance.upgrade_history?.length !== 0) throw new Error('Release provenance must start without installed-project history');
          const versions = {
            'templates/store-rulebook.md.template': fs.readFileSync(root + 'templates/store-rulebook.md.template', 'utf8').match(/^template_version:\s*([^\r\n]+)$/m)?.[1],
            'microsoft-store/templates/asset-inventory.json.template': JSON.parse(fs.readFileSync(root + 'microsoft-store/templates/asset-inventory.json.template', 'utf8')).template_version,
          };
          if (Object.keys(provenance.upstream.template_versions).length !== Object.keys(versions).length ||
              Object.entries(versions).some(([name, version]) => !version || provenance.upstream.template_versions[name] !== version)) throw new Error('Source provenance template versions disagree with shipped templates');
          provenance.upstream = {
            repository: 'https://github.com/' + repository, release, commit, template_versions: versions,
            evidence: 'Tagged release build from this repository and full source commit; provenance was stamped in the archive staging copy, not the source tree.',
          };
          fs.writeFileSync(root + 'provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          NODE
          (cd dist && zip -r "../store-assets-starter-kit-${GITHUB_REF_NAME}.zip" store-assets)

      - name: Verify zip layout
        run: |
          archive="store-assets-starter-kit-${GITHUB_REF_NAME}.zip"
          entries="$(unzip -Z1 "$archive")"

          if printf '%s\n' "$entries" | grep -qv '^store-assets/'; then
            echo "ERROR: archive contains paths outside store-assets/"
            exit 1
          fi

          for required in README.md checking.md upgrading.md provenance.json store-assets-workflow.md templates/store-rulebook.md.template scripts/check-store-assets.mjs examples/update-tasks.md examples/submission-history.md examples/logo-assets.md examples/manual-upgrade.md examples/session-handoff.md microsoft-store/asset-rules.md microsoft-store/templates/asset-inventory.json.template; do
            if ! printf '%s\n' "$entries" | grep -qx "store-assets/$required"; then
              echo "ERROR: required package file missing: $required"
              exit 1
            fi
          done

          if printf '%s\n' "$entries" | grep -Eq '^store-assets/(AGENTS\.md|docs/|reference/|tests/)'; then
            echo "ERROR: development files packaged"
            exit 1
          fi

          if unzip -p "$archive" store-assets/README.md | grep -q '{{'; then
            echo "ERROR: static README contains unresolved placeholders"
            exit 1
          fi

      - name: Get or create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            if [ "$(gh release view "${{ github.ref_name }}" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "ERROR: refusing to modify a published release"
              exit 1
            fi
            echo "draft release exists"
          else
            gh release create "${{ github.ref_name }}" --draft --title "Store Assets Starter Kit ${{ github.ref_name }}" --notes "Release description to be filled in."
          fi

      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view "${{ github.ref_name }}" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "ERROR: refusing to replace an asset on a published release"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" store-assets-starter-kit-${{ github.ref_name }}.zip --clobber
